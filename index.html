<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#F9F7F4" />
  <title>Meet Devin | Cognition</title>
  <link rel="icon" href="logo.png" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="page">
    <header class="hero">
      <img class="logo" src="logo.png" alt="Cognition" width="36" height="40" />
      <h1>Meet Devin, the AI software engineer.</h1>
      <p class="sub">Leave your email and we will send you a link to redeem a 2 month trial of the Devin Max plan</p>
    </header>

    <form id="lead-form" class="card" novalidate>
      <div class="field">
        <label for="email">Work email</label>
        <input id="email" name="email" type="email" autocomplete="email" inputmode="email" required placeholder="ada@company.com" />
      </div>

      <label class="check">
        <input id="consent" name="consent" type="checkbox" required />
        <span>I agree to be contacted by Cognition about its products.</span>
      </label>

      <button type="submit" class="btn">Submit</button>
      <p id="error" class="error" role="alert" hidden></p>
    </form>

    <section id="thanks" class="card thanks" hidden>
      <h2>Thanks! We will be in touch.</h2>
      <button id="another" class="btn secondary" type="button">Capture another lead</button>
    </section>
  </main>
  <script src="app.js"></script>
</body>
</html>
